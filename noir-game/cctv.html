<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOIR — CCTV / CAM 04</title><style>:root{--bg:#07090b;--line:#2c3337;--ink:#e7e2d8;--muted:#879096;--gold:#c7a25d;--red:#c6534c}*{box-sizing:border-box}body{margin:0;background:#060708;color:var(--ink);font:13px system-ui,Arial}.app{min-height:100vh;padding:14px;max-width:1400px;margin:auto}.top{height:48px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);letter-spacing:.12em}.rec{color:#ddd}.dot{display:inline-block;width:9px;height:9px;background:var(--red);border-radius:50%;margin-right:7px;animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:.25}}.grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:12px;margin-top:12px}.monitor{position:relative;min-height:650px;overflow:hidden;border:1px solid #343b3e;background:radial-gradient(circle at 50% 30%,#343b3d,#111516 42%,#07090a 80%);box-shadow:0 25px 80px #000}.hall{position:absolute;inset:0;background:linear-gradient(90deg,#0a0c0d 0 10%,transparent 10% 90%,#090b0c 90%),linear-gradient(155deg,transparent 0 48%,#22292a 48% 49%,transparent 49%),linear-gradient(25deg,transparent 0 48%,#202526 48% 49%,transparent 49%)}.door{position:absolute;top:14%;width:13%;height:43%;border:4px solid #222827;background:#111617;box-shadow:inset 0 0 25px #000}.d1{left:13%}.d2{left:39%}.d3{right:14%}.light{position:absolute;top:10%;width:14%;height:2px;background:#77766d;box-shadow:0 0 22px #d7cfae}.l1{left:19%}.l2{left:46%}.l3{right:19%}.person{position:absolute;bottom:12%;left:23%;width:120px;height:390px;transform-origin:bottom center;animation:walk 11s linear infinite}.head{position:absolute;left:34px;top:0;width:52px;height:62px;border-radius:48% 48% 45% 45%;background:#282b2b;border:2px solid #151818}.body{position:absolute;left:18px;top:54px;width:84px;height:205px;border-radius:25px 25px 8px 8px;background:#181c1d;border:2px solid #0e1112}.arm{position:absolute;top:70px;width:22px;height:170px;background:#171a1b;border-radius:14px}.a1{left:10px;transform:rotate(8deg)}.a2{right:10px;transform:rotate(-12deg)}.leg{position:absolute;top:240px;width:27px;height:145px;background:#101314;border-radius:12px}.g1{left:29px;transform:rotate(2deg)}.g2{right:29px;transform:rotate(-2deg)}@keyframes walk{0%{left:20%;transform:scale(.9)}45%{left:43%;transform:scale(1)}63%{left:52%;transform:scale(1.04)}70%{left:54%;transform:scale(1.04)}76%{left:54%;transform:scale(1.04)}100%{left:78%;transform:scale(1.1)}}.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.035) 4px 5px);pointer-events:none;mix-blend-mode:screen}.noise{position:absolute;inset:0;opacity:.12;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:5px 5px;animation:noise .15s steps(2) infinite}@keyframes noise{50%{transform:translate(3px,-2px)}}.glitch{position:absolute;inset:0;background:#d9d9d91a;opacity:0;animation:glitch 13s infinite}@keyframes glitch{0%,62%,65%,100%{opacity:0}63%{opacity:.5;transform:translateX(7px)}64%{opacity:.15;transform:translateX(-9px)}}.stamp{position:absolute;left:18px;top:18px;text-shadow:0 1px 3px #000;font:18px monospace}.stamp small{display:block;font-size:13px;margin-top:5px}.camlabel{position:absolute;left:18px;bottom:18px;background:#050606b8;border:1px solid #3b4141;padding:10px 13px;font:12px monospace}.side{display:flex;flex-direction:column;gap:12px}.panel{border:1px solid var(--line);background:#0d1113;padding:15px}.panel h3{margin:0 0 12px;color:var(--gold);font-size:11px;letter-spacing:.16em}.cams button,.controls button{width:100%;padding:11px;margin:4px 0;background:#101416;border:1px solid #2d3539;color:#bfc4c5;text-align:left;cursor:pointer}.cams button.active,.cams button:hover,.controls button:hover{border-color:var(--gold);color:#ead9b0}.timeline{height:170px;position:relative;border-left:1px solid #4a4d4b;margin:12px 0 0 15px}.mark{position:absolute;left:-5px;width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px #c7a25d}.m1{top:22%}.m2{top:51%;background:var(--red)}.m3{top:78%}.tick{position:absolute;left:14px;color:#727b80;font:11px monospace}.t1{top:18%}.t2{top:47%}.t3{top:74%}.time{font:22px monospace;color:#ddd;text-align:center}.hint{color:#899297;line-height:1.6}.back{display:block;text-decoration:none;text-align:center;border:1px solid #6f5a35;padding:12px;color:#ddc58f;margin-top:auto}@media(max-width:800px){.grid{grid-template-columns:1fr}.monitor{min-height:62vh}.side{display:grid;grid-template-columns:1fr 1fr}.side .panel:last-child{grid-column:1/-1}.person{transform-origin:bottom center}}@media(max-width:520px){.side{display:block}.monitor{min-height:55vh}.person{transform:scale(.72);transform-origin:bottom left}.stamp{font-size:13px}.stamp small{font-size:10px}}</style></head><body><div class="app"><header class="top"><b>NOIR / DOSYA 01</b><span class="rec"><i class="dot"></i>REC · ARŞİV OYNATILIYOR</span></header><main class="grid"><section class="monitor"><div class="hall"><div class="door d1"></div><div class="door d2"></div><div class="door d3"></div><div class="light l1"></div><div class="light l2"></div><div class="light l3"></div></div><div class="person"><div class="head"></div><div class="body"></div><div class="arm a1"></div><div class="arm a2"></div><div class="leg g1"></div><div class="leg g2"></div></div><div class="stamp">HOTEL PERA · CAM 04<small id="stamp">14/10/2024&nbsp;&nbsp;23:16:42</small></div><div class="camlabel">KAT 02 — 201–208<br>KORİDOR</div><div class="scan"></div><div class="noise"></div><div class="glitch"></div></section><aside class="side"><div class="panel cams"><h3>KAMERA LİSTESİ</h3><button>CAM 01 — LOBİ</button><button>CAM 02 — ASANSÖR</button><button>CAM 03 — KAT 01</button><button class="active">CAM 04 — KAT 02</button><button>CAM 05 — KAT 03</button><button>CAM 06 — OTOPARK</button><button>CAM 07 — ARKA KAPI</button></div><div class="panel"><h3>KAYIT ZAMAN ÇİZELGESİ</h3><div class="time" id="time">23:16:42</div><div class="timeline"><span class="mark m1"></span><span class="mark m2"></span><span class="mark m3"></span><span class="tick t1">23:10</span><span class="tick t2">23:17</span><span class="tick t3">23:24</span></div></div><div class="panel controls"><h3>KAYIT KONTROLÜ</h3><button onclick="setSpeed(.5)">◀◀ 0.5x</button><button onclick="toggle()" id="pause">Ⅱ DURAKLAT</button><button onclick="setSpeed(2)">▶▶ 2x</button><p class="hint">23:17:00 civarındaki görüntü bozulmasını kaçırma.</p></div><a class="back" href="./play.html">← OLAY YERİNE DÖN</a></aside></main></div><script>let sec=42,run=true,speed=1;const time=document.getElementById('time'),stamp=document.getElementById('stamp'),person=document.querySelector('.person');function tick(){if(run){sec+=speed;if(sec>59)sec=0;let s=String(Math.floor(sec)).padStart(2,'0');time.textContent='23:16:'+s;stamp.textContent='14/10/2024  23:16:'+s}}setInterval(tick,1000);function toggle(){run=!run;document.getElementById('pause').textContent=run?'Ⅱ DURAKLAT':'▶ OYNAT';person.style.animationPlayState=run?'running':'paused'}function setSpeed(v){speed=v;person.style.animationDuration=(11/v)+'s';if(!run)toggle()}</script></body></html>
